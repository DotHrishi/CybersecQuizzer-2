name: Keep Database Awake

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC) to prevent Supabase from auto-pausing
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

jobs:
  keep-alive:
    name: Ping Database & App
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Web App
        run: |
          echo "=========================================================="
          echo " Starting Database Keep-Alive Routine"
          echo "=========================================================="

          # Resolve Supabase URL with fallback cascade
          URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$URL" ]; then
            URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          fi
          if [ -z "$URL" ]; then
            URL="https://xxhnkkpmizowrgireaui.supabase.co"
          fi

          # Resolve Supabase Key with fallback cascade
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$KEY" ]; then
            KEY="${{ secrets.SUPABASE_KEY }}"
          fi
          if [ -z "$KEY" ]; then
            KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
          fi
          if [ -z "$KEY" ]; then
            KEY="sb_publishable_uOEVESKjGVyLa5fo1ZPDxw_khj-FxdT"
          fi

          # Clean quotes, spaces, trailing slash
          URL=$(echo "$URL" | xargs | tr -d '"' | tr -d "'")
          URL="${URL%/}"
          KEY=$(echo "$KEY" | xargs | tr -d '"' | tr -d "'")

          echo "Target Supabase Host: ${URL}"

          # 1. Ping questions table (triggers active query against PostgreSQL)
          echo "--> Pinging /rest/v1/questions table..."
          STATUS_Q=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "${URL}/rest/v1/questions?select=id&limit=1")
          echo "    Questions Table HTTP Status: $STATUS_Q"

          # 2. Ping user_attempts table
          echo "--> Pinging /rest/v1/user_attempts table..."
          STATUS_A=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "${URL}/rest/v1/user_attempts?select=id&limit=1")
          echo "    User Attempts Table HTTP Status: $STATUS_A"

          # 3. Ping colleges table
          echo "--> Pinging /rest/v1/colleges table..."
          STATUS_C=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "${URL}/rest/v1/colleges?select=id&limit=1")
          echo "    Colleges Table HTTP Status: $STATUS_C"

          # 4. Fallback root REST API ping if tables returned 404
          if [ "$STATUS_Q" -eq 404 ] && [ "$STATUS_A" -eq 404 ]; then
            echo "--> Falling back to Supabase OpenAPI Schema ping..."
            STATUS_ROOT=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Accept: application/json" \
              "${URL}/rest/v1/")
            echo "    Root REST API HTTP Status: $STATUS_ROOT"
          fi

          # 5. Ping production application API to warm serverless & database connections
          APP_URL="${{ secrets.APP_URL }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://cybersecurity-quiz-app-2.vercel.app"
          fi
          APP_URL="${APP_URL%/}"

          echo "--> Pinging production app API at ${APP_URL}/api/leaderboard..."
          STATUS_APP=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "${APP_URL}/api/leaderboard" || echo "000")
          echo "    App Leaderboard API HTTP Status: $STATUS_APP"

          echo "=========================================================="
          echo " Evaluation Summary:"
          echo " - Questions Query:    $STATUS_Q"
          echo " - Attempts Query:     $STATUS_A"
          echo " - Colleges Query:     $STATUS_C"
          echo " - App API Ping:       $STATUS_APP"
          echo "=========================================================="

          # Check if at least one Supabase query succeeded
          if [ "$STATUS_Q" -ge 200 ] && [ "$STATUS_Q" -lt 400 ] || \
             [ "$STATUS_A" -ge 200 ] && [ "$STATUS_A" -lt 400 ] || \
             [ "$STATUS_C" -ge 200 ] && [ "$STATUS_C" -lt 400 ]; then
            echo " Database is ACTIVE and awake! Keep-alive succeeded."
            exit 0
          elif [ "$STATUS_APP" -ge 200 ] && [ "$STATUS_APP" -lt 400 ]; then
            echo " Production App API responded ($STATUS_APP) and triggered database query. Keep-alive succeeded."
            exit 0
          else
            echo " Warning: Database ping responses did not return 2xx/3xx. Please verify credentials."
            exit 1
          fi
